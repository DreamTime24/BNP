<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live World News | BNP</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    .navbar {
      background-color: #002244;
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .navbar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .navbar li {
      margin: 0 15px;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .navbar a:hover {
      color: #f0c000;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #002244;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .news-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .news-card:hover {
      transform: translateY(-5px);
    }

    .news-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .news-card-content {
      padding: 20px;
    }

    .news-card-content h3 {
      margin-top: 0;
      color: #111;
    }

    .news-card-content p {
      color: #555;
      font-size: 0.95rem;
    }

    .news-card-content a {
      margin-top: 10px;
      display: inline-block;
      text-decoration: none;
      color: #0077cc;
      font-weight: bold;
    }

    .news-card-content a:hover {
      text-decoration: underline;
    }

    .pagination {
      text-align: center;
      margin-top: 40px;
    }

    .pagination button {
      background: #002244;
      color: white;
      padding: 10px 20px;
      margin: 0 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .pagination button.active {
      background: #f0c000;
      color: #000;
    }

    footer {
      margin-top: 60px;
      background-color: #002244;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="leaders.html">Leaders</a></li>
      <li><a href="news.html" class="active">News</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="join.html">Join</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Live World News</h1>
    <div class="news-grid" id="news-container"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <footer>
    &copy; 2025 Bangladesh Nationalist Party. All Rights Reserved.
  </footer>

  <script>
    const feeds = [
      'https://feeds.bbci.co.uk/news/world/rss.xml',
      'https://rss.cnn.com/rss/edition_world.rss',
      'https://www.aljazeera.com/xml/rss/all.xml'
    ];

    let allNews = [];
    let currentPage = 1;
    const pageSize = 9;

    async function fetchNews(feedUrl) {
      const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`);
      const data = await response.json();
      return data.items;
    }

    async function loadNews() {
      const promises = feeds.map(feed => fetchNews(feed));
      const results = await Promise.all(promises);
      allNews = results.flat().slice(0, 150);
      renderNews();
      renderPagination();
    }

    function renderNews() {
      const container = document.getElementById('news-container');
      container.innerHTML = '';
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const newsToShow = allNews.slice(start, end);

      newsToShow.forEach(item => {
        const card = document.createElement('div');
        card.className = 'news-card';
        card.innerHTML = `
          <img src="${item.thumbnail || 'https://via.placeholder.com/400x200'}" alt="News image">
          <div class="news-card-content">
            <h3>${item.title}</h3>
            <p>${item.description.slice(0, 100)}...</p>
            <a href="${item.link}" target="_blank">Read more</a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(allNews.length / pageSize);
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.onclick = () => {
          currentPage = i;
          renderNews();
          renderPagination();
        };
        pagination.appendChild(btn);
      }
    }

    loadNews();
  </script>
</body>
</html>
