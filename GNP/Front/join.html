<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join BNP</title>
  <style>
    /* Core Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
      color: #fff;
      overflow-x: hidden;
    }

    /* Background Video */
    .background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.3) blur(2px);
    }

    /* Glassmorphic Form */
    .form-container {
      max-width: 800px;
      margin: 120px auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      padding: 40px;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.2);
      animation: fadeInUp 1s ease-in-out;
    }

    h1 {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 40px;
      text-shadow: 0 0 20px #f7c600, 0 0 30px #ff6600;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      text-transform: uppercase;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(to right, #f7c600, #ff6600);
      color: #000;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: all 0.4s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #f7c600;
    }

    /* 4D Visual Lighting Effect */
    .neon-border {
      border: 4px solid;
      border-image: linear-gradient(45deg, #f7c600, #ff6600, #f7c600) 1;
      animation: glowBorder 2s linear infinite;
    }

    @keyframes glowBorder {
      0% { border-image: linear-gradient(45deg, #f7c600, #ff6600) 1; }
      50% { border-image: linear-gradient(45deg, #ff6600, #f7c600) 1; }
      100% { border-image: linear-gradient(45deg, #f7c600, #ff6600) 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media screen and (max-width: 768px) {
      .form-container {
        margin: 80px 20px;
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  

  <div class="form-container neon-border">
    <h1>Join BNP</h1>
    <form>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="+8801XXXXXXX" required />

      <label for="nid">NID Number</label>
      <input type="text" id="nid" name="nid" placeholder="National ID Number" required />

      <label for="division">Division</label>
      <select id="division" name="division">
        <option>Dhaka</option>
        <option>Chittagong</option>
        <option>Khulna</option>
        <option>Rajshahi</option>
        <option>Barisal</option>
        <option>Sylhet</option>
        <option>Rangpur</option>
        <option>Mymensingh</option>
      </select>

      <label for="message">Why do you want to join BNP?</label>
      <textarea id="message" name="message" rows="5" placeholder="Write your reason here..."></textarea>

      <button type="submit">Submit Application</button>
    </form>
  </div>
</body>
</html>
