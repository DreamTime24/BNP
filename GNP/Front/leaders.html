  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, #0e0e0e, #1e1e1e);
      color: #fff;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
    }

    h1 {
      color: #00ffe0;
      margin-bottom: 10px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 15px;
      padding: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      background: #333;
    }

    .card h3 {
      margin-top: 12px;
      font-size: 1.1rem;
      color: #00ffe0;
    }

    .card p {
      font-size: 0.85rem;
      margin-top: 6px;
      color: #aaa;
    }

    .search-container {
      max-width: 800px;
      margin: 0 auto 30px;
    }

    #search {
      width: 100%;
      padding: 12px 20px;
      border-radius: 30px;
      border: none;
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 16px;
      outline: none;
    }

    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 30px;
      gap: 10px;
    }

    .pagination button {
      padding: 8px 15px;
      background: rgba(0, 255, 255, 0.1);
      color: #00ffe0;
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 5px;
      cursor: pointer;
    }

    .pagination button:hover {
      background: rgba(0, 255, 255, 0.2);
    }

    @media screen and (max-width: 768px) {
      .container {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
      }
      
      .card img {
        height: 120px;
      }
      
      .card h3 {
        font-size: 1rem;
      }
    }
  </style>
</head>

    // Pagination variables
    let currentPage = 1;
    const leadersPerPage = 20;
    let filteredLeaders = [...leaders];

    // Function to display leaders for current page
    function displayLeaders() {
      const container = document.getElementById('leadersContainer');
      container.innerHTML = '';
      
      const startIndex = (currentPage - 1) * leadersPerPage;
      const endIndex = startIndex + leadersPerPage;
      const paginatedLeaders = filteredLeaders.slice(startIndex, endIndex);
      
      if (paginatedLeaders.length === 0) {
        container.innerHTML = '<p style="grid-column:1/-1;text-align:center;">No leaders found matching your search</p>';
        return;
      }
      
      paginatedLeaders.forEach(leader => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${leader.image}" alt="${leader.name}" onerror="this.src='https://via.placeholder.com/300x200?text=BNP+Leader'">
          <h3>${leader.name}</h3>
          <p>${leader.position}</p>
          <p>${leader.district}</p>
        `;
        container.appendChild(card);
      });
      
      // Update page info
      const totalPages = Math.ceil(filteredLeaders.length / leadersPerPage);
      document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    }

    // Search function
    function searchLeaders() {
      const input = document.getElementById('search');
      const searchTerm = input.value.trim().toLowerCase();
      
      if (searchTerm === '') {
        filteredLeaders = [...leaders];
      } else {
        filteredLeaders = leaders.filter(leader => 
          leader.name.toLowerCase().includes(searchTerm) || 
          leader.position.toLowerCase().includes(searchTerm) ||
          leader.district.toLowerCase().includes(searchTerm)
        );
      }
      
      currentPage = 1;
      displayLeaders();
    }

    // Pagination functions
    function nextPage() {
      const totalPages = Math.ceil(filteredLeaders.length / leadersPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        displayLeaders();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        displayLeaders();
      }
    }

    // Initialize the page
    window.onload = displayLeaders;
